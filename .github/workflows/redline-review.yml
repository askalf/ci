# Redline: the gating code review, as a CI check. Each reviewed repo calls this from its own
# redline.yml on pull_request; the job's result is the verdict (APPROVE passes, REQUEST_CHANGES fails).
# It runs on the caller's self-hosted runner, which reaches the model locally and reads its
# credentials and its system prompt from files on the host, so no secret is stored in GitHub and
# the reviewer's rubric sits in no public repository.
# Hosted mode: a caller with no runner host passes hosted-runner (ubuntu-latest) and two secrets, the
# model endpoint's key and its own rubric. The job then runs on GitHub's runner, writes both to files
# under the runner's temp directory and reads them as it reads a host's; the rest of the review is
# the same. The secrets are the caller's repository secrets, within reach of every workflow there,
# as any repository secret is.
# Hosted mode with a dario sidecar: a caller that would spend subscription seats, not API credit,
# passes dario-image and dario-lock-url with the dario-lock-token secret in place of model-api-key.
# The job starts that dario on the runner, bound to loopback, with a key made for this run; dario
# takes its seats from the lock service's account registry and the review is read through it.
# The finished review is uploaded as the redline-verdict artifact (verdict.json). When the host file
# holds no reviewer token the review is not posted here: the ops tick, or the repository's own
# redline-post.yml, posts it as the reviewer account (reviewer-login, sprayberry-redline by default)
# only after checking, from the GitHub API, that the run came from the pinned redline.yml at the PR's
# current head and that the PR changes no workflow or action definitions.
# The PR's code is checked out only to be read by the review's read-only tools; nothing from it runs.
#
# A second lens: a caller on a self-hosted runner that passes second-reviewer-login gets a second
# review of every head the first one approved, in the same job: the same script, read as that
# account, with the env file and rubric the host keeps for it (second-env-file and
# second-prompt-file), so a second reader with its own brief, on a model of the host's choosing.
# Its verdict is uploaded as the redline-verdict-second artifact and posted by the post caller as
# the second account. The step never changes the job's result, which stays the first review's
# verdict: a second lens that asks for changes says so in its posted review, and one that could
# not finish leaves no verdict, which a re-run of the job gives it. A pull request that only moves
# pins is approved by the second lens without a model call, once every pin is seen to move in
# place to a commit on ci-repo's main that is ahead of the one it replaces.
#
# Dispatch mode: a caller's redline.yml also takes workflow_dispatch, and the ops tick dispatches it on the
# default branch with the PR, the head to review and whether this is a re-read of a head already
# reviewed. The run then executes the default branch's workflow files, not the PR's, so its verdict
# holds even for a PR that changes CI definitions. The ops tick uses it for every head its pull_request run
# cannot vouch for: a PR that changes CI, a verdict it refused, and a description-only re-read.
# Fork PRs come here only in dispatch mode (operator, 2026-10-18). The pull_request path still refuses
# a fork head before anything is fetched. On a dispatch the default branch's workflow files run, the
# PR is read from the API, and the fork head is fetched by the repository's own pull ref, compared
# with the sha the ops tick named, and checked out with symlinks written as plain files. The review's tools
# only list, read and search inside that checkout (review.mjs confines every path by its real path);
# nothing from the head executes, and the job holds no credential that could write anywhere. A fork
# PR whose workflows are still held at the contributor gate ("Approve and run") is not reviewed: the
# check below fails until a maintainer has let that head's workflows run.
name: Redline review

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          The caller's self-hosted runner label. Every caller passes this or hosted-runner, never both.
        required: false
        default: ''
        type: string
      hosted-runner:
        description: >-
          Hosted mode: the GitHub-hosted runner label to review on, such as ubuntu-latest, in
          place of runner-label. The endpoint's key and the rubric then come from the
          model-api-key and reviewer-prompt secrets, and env-file and prompt-file are not read.
        required: false
        default: ''
        type: string
      model-url:
        description: >-
          Hosted mode only. The address of the model endpoint, which must answer Anthropic
          Messages API requests at /v1/messages. https only: the key travels with every request.
        required: false
        default: https://api.anthropic.com
        type: string
      model:
        description: >-
          Hosted mode only. The model every review is read on; empty takes review.mjs's default.
        required: false
        default: ''
        type: string
      deep-model:
        description: >-
          Hosted mode only. The model for a large or sensitive pull request; empty reads those on model.
        required: false
        default: ''
        type: string
      dario-image:
        description: >-
          Hosted mode only. A dario image pinned by digest (ghcr.io/askalf/dario@sha256:...), to
          run as a sidecar on the runner and read the review through, in place of model-url and
          model-api-key. It gets its seats from the registry at dario-lock-url.
        required: false
        default: ''
        type: string
      dario-lock-url:
        description: >-
          With dario-image. The address of the dario lock service whose account registry holds
          the seats the sidecar serves. https only: the lock token travels with every request.
        required: false
        default: ''
        type: string
      redline-ref:
        description: >-
          The full commit sha of ci-repo this workflow is called at, the same sha as the
          caller's uses pin. The review script is fetched at it. It must be a commit on main.
        required: true
        type: string
      ci-repo:
        description: >-
          The repository this workflow and its script come from, as owner/name: askalf/ci, or a
          fork that runs its own copy. The script is fetched from it at redline-ref.
        required: false
        default: askalf/ci
        type: string
      reviewer-login:
        description: >-
          The account whose posted reviews are Redline's: the one whose token the post caller
          passes. A review it already posted at the head is not made again.
        required: false
        default: sprayberry-redline
        type: string
      dispatch-actor:
        description: >-
          The account whose dispatches of the caller's redline.yml are trusted as review history:
          the one that dispatches a review for a head the pull_request run cannot vouch for. The
          post caller passes the same login.
        required: false
        default: askalf
        type: string
      env-file:
        description: >-
          The host file with the model endpoint's address and key and the model settings. An absolute path on the runner host.
        required: false
        default: /etc/askalf/redline.env
        type: string
      prompt-file:
        description: >-
          The host file with the reviewer's rubric. An absolute path on the runner host; it is never committed.
        required: false
        default: /etc/askalf/redline-prompt.md
        type: string
      second-reviewer-login:
        description: >-
          Self-hosted runners only. The account of a second lens: set, every head the review
          approves is read once more in the same job as this account, with second-env-file and
          second-prompt-file, and the post caller posts that verdict with the account's token.
          Empty, the default, runs one review as before.
        required: false
        default: ''
        type: string
      second-env-file:
        description: >-
          The host file with the second lens's model endpoint, key and model settings: the same
          keys as env-file. An absolute path on the runner host. Read only with second-reviewer-login.
        required: false
        default: /etc/askalf/redline-second.env
        type: string
      second-prompt-file:
        description: >-
          The host file with the second lens's rubric. An absolute path on the runner host; it is
          never committed. Read only with second-reviewer-login.
        required: false
        default: /etc/askalf/redline-second-prompt.md
        type: string
      pr:
        description: Dispatch mode only. The pull request number; empty on pull_request.
        required: false
        default: ''
        type: string
      head:
        description: Dispatch mode only. The full commit sha to review; the run fails if the PR is not at it.
        required: false
        default: ''
        type: string
      reread:
        description: Dispatch mode only. Review the head even when a Redline verdict already stands there.
        required: false
        default: false
        type: boolean
    secrets:
      model-api-key:
        description: Hosted mode only. The model endpoint's API key, sent as x-api-key.
        required: false
      reviewer-prompt:
        description: >-
          Hosted mode only. The reviewer's rubric, the whole system prompt. It is the caller's
          own text: this repository carries none.
        required: false
      dario-lock-token:
        description: >-
          With dario-image. The lock service's bearer token. Whoever holds it can use every seat
          in that registry, so it should be a registry made for hosted reviews, not a main pool's.
        required: false

# actions: read lets a fork dispatch list the head's pull_request runs and their jobs (the
# contributor-gate check). A called workflow gets no more than its caller grants, so each caller's
# redline.yml grants it too.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  redline:
    # Same-repo PRs only: a fork's code never reaches the self-hosted runner. Drafts wait. A dispatch
    # names its PR in inputs and is checked by the first steps, before anything is fetched.
    if: inputs.pr != '' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    # The caller's self-hosted label, or in hosted mode the GitHub runner it names. With neither,
    # the job starts on GitHub's runner only to say so: the runner check below fails it.
    runs-on: ${{ inputs.hosted-runner != '' && inputs.hosted-runner || inputs.runner-label != '' && fromJSON(format('["self-hosted","{0}"]', inputs.runner-label)) || 'ubuntu-latest' }}
    # One review ends inside 20 minutes (review.mjs stops itself at 18). With a second lens the job
    # holds two, and the second has a step timeout of its own.
    timeout-minutes: ${{ inputs.second-reviewer-login != '' && 40 || 20 }}
    steps:
      # github.job_workflow_sha is not available to expressions (it evaluates empty, and the
      # checkout then falls back to the default branch), so the caller passes the sha it pins as
      # redline-ref. It must be a full sha, so it cannot name a moving branch or tag, and a commit
      # on main, so a PR cannot point its own review at a script from its unmerged branch.
      - name: Check the review ref is a full commit sha
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
        run: |
          if ! [[ "$REDLINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::redline-ref must be the full 40-character commit sha the caller pins; got '${REDLINE_REF}'"
            exit 1
          fi

      - name: Check the review ref is on main of ci-repo
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
          CI_REPO: ${{ inputs.ci-repo }}
          GH_READ_TOKEN: ${{ github.token }}
        # main is ahead of or identical to the ref exactly when the ref is on main. A failed read
        # is retried, then fails the review: it is never taken as a pass.
        run: |
          node --input-type=module -e '
            const ref = process.env.REDLINE_REF;
            const repo = process.env.CI_REPO;
            if (!/^[A-Za-z0-9-]+[/][A-Za-z0-9._-]+$/.test(repo)) { console.log(`::error::ci-repo must be owner/name; got ${JSON.stringify(repo)}`); process.exit(1); }
            const url = `https://api.github.com/repos/${repo}/compare/${ref}...main`;
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            let status = "";
            for (let attempt = 1; attempt <= 3 && !status; attempt++) {
              try {
                const res = await fetch(url, { headers });
                if (res.ok) status = String((await res.json()).status ?? "");
                else console.log(`attempt ${attempt}: HTTP ${res.status}`);
              } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
              if (!status && attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
            }
            if (status === "ahead" || status === "identical") { console.log(`redline-ref ${ref} is on main`); process.exit(0); }
            console.log(status
              ? `::error::redline-ref ${ref} is not a commit on ${repo} main (${status})`
              : `::error::could not compare redline-ref ${ref} with ${repo} main`);
            process.exit(1);
          '

      # One runner, named one way. In hosted mode the endpoint's key and the rubric arrive as the
      # caller's secrets and are written, owner-only, under the runner's temp directory, as the env
      # file and the prompt file a host would carry; the review step reads those paths. Every
      # value reaches the script through env and is checked before it is written: a value with a
      # line break could add a line to the env file. No fallback or pin model is set, so every
      # review is read on model (or deep-model): the script's defaults for those two name models
      # another endpoint may not have.
      # With dario-image the endpoint is a dario this job starts on loopback: the env file names it
      # with a key made here for this run, and a second owner-only file carries what the container
      # is started with (that key, the lock service's address and token, and the two switches that
      # make dario take its accounts and their rate-limit readings from the registry). The image
      # must be pinned by digest: it is handed the lock token.
      - name: Check where the review runs
        id: where
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
          MODEL_URL: ${{ inputs.model-url }}
          MODEL: ${{ inputs.model }}
          DEEP_MODEL: ${{ inputs.deep-model }}
          DARIO_IMAGE: ${{ inputs.dario-image }}
          DARIO_LOCK_URL: ${{ inputs.dario-lock-url }}
          MODEL_API_KEY: ${{ secrets.model-api-key }}
          REVIEWER_PROMPT: ${{ secrets.reviewer-prompt }}
          DARIO_LOCK_TOKEN: ${{ secrets.dario-lock-token }}
          SECOND_REVIEWER_LOGIN: ${{ inputs.second-reviewer-login }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          dir="${RUNNER_TEMP}/redline-hosted"
          rm -rf "$dir"
          if [ -n "$HOSTED_RUNNER" ] && [ -n "$SECOND_REVIEWER_LOGIN" ]; then
            fail "second-reviewer-login is for a self-hosted runner: the second lens reads its env file and rubric on the runner host, and hosted mode has neither"
          fi
          if [ -n "$RUNNER_LABEL" ] && [ -n "$HOSTED_RUNNER" ]; then
            fail "pass runner-label (a self-hosted runner) or hosted-runner (a GitHub-hosted one), not both"
          fi
          if [ -z "$RUNNER_LABEL" ] && [ -z "$HOSTED_RUNNER" ]; then
            fail "pass runner-label (a self-hosted runner) or hosted-runner (a GitHub-hosted one, such as ubuntu-latest)"
          fi
          if [ -z "$HOSTED_RUNNER" ]; then
            if [ -n "$MODEL_API_KEY" ] || [ -n "$REVIEWER_PROMPT" ] || [ -n "$DARIO_LOCK_TOKEN" ] || [ -n "$DARIO_IMAGE" ] || [ -n "$DARIO_LOCK_URL" ] || [ -n "$MODEL" ] || [ -n "$DEEP_MODEL" ]; then
              fail "the model-api-key, reviewer-prompt and dario-lock-token secrets and the model, deep-model and dario inputs are read only in hosted mode (hosted-runner); a self-hosted runner reads env-file and prompt-file on its host"
            fi
            echo "the review runs on the self-hosted runner ${RUNNER_LABEL}, with the host's env file and prompt file"
            exit 0
          fi
          one_line='^[^[:cntrl:]]+$'
          [[ "$MODEL" =~ ^[A-Za-z0-9._:/-]*$ ]] || fail "model must be a model id; got '${MODEL}'"
          [[ "$DEEP_MODEL" =~ ^[A-Za-z0-9._:/-]*$ ]] || fail "deep-model must be a model id; got '${DEEP_MODEL}'"
          [ -n "${REVIEWER_PROMPT//[[:space:]]/}" ] || fail "the reviewer-prompt secret is empty: hosted mode needs the caller's own rubric (a Dependabot pull request reads Dependabot secrets, not Actions secrets)"
          if [ -z "$DARIO_IMAGE" ]; then
            if [ -n "$DARIO_LOCK_URL" ] || [ -n "$DARIO_LOCK_TOKEN" ]; then
              fail "dario-lock-url and the dario-lock-token secret are read only with dario-image"
            fi
            [[ "$MODEL_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$ ]] || fail "model-url must be an https address with no query; got '${MODEL_URL}'"
            [ -n "$MODEL_API_KEY" ] || fail "the model-api-key secret is empty: hosted mode needs the endpoint's key, or dario-image for a dario sidecar (a Dependabot pull request reads Dependabot secrets, not Actions secrets)"
            [[ "$MODEL_API_KEY" =~ $one_line ]] || fail "the model-api-key secret must be one line"
            endpoint="$MODEL_URL"
            key="$MODEL_API_KEY"
          else
            [[ "$DARIO_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]] || fail "dario-image must be an image pinned by digest (name@sha256:...), since it is handed the lock token; got '${DARIO_IMAGE}'"
            [[ "$DARIO_LOCK_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$ ]] || fail "dario-lock-url must be an https address with no query; got '${DARIO_LOCK_URL}'"
            [ -z "$MODEL_API_KEY" ] || fail "pass the model-api-key secret or dario-image, not both: the sidecar is the endpoint and its key is made for this run"
            [ -n "$DARIO_LOCK_TOKEN" ] || fail "the dario-lock-token secret is empty: the sidecar needs the lock service's token (a Dependabot pull request reads Dependabot secrets, not Actions secrets)"
            [[ "$DARIO_LOCK_TOKEN" =~ $one_line ]] || fail "the dario-lock-token secret must be one line"
            endpoint="http://127.0.0.1:3456"
            key="$(openssl rand -hex 32)"
            echo "::add-mask::${key}"
          fi
          umask 077
          mkdir -p "$dir"
          printf 'DARIO_URL=%s\nDARIO_API_KEY=%s\nREDLINE_MODEL=%s\nREDLINE_DEEP_MODEL=%s\nREDLINE_PIN_MODEL=\nREDLINE_FALLBACK_MODEL=\n' "$endpoint" "$key" "$MODEL" "$DEEP_MODEL" > "${dir}/redline.env"
          printf '%s\n' "$REVIEWER_PROMPT" > "${dir}/prompt.md"
          echo "env-file=${dir}/redline.env" >> "$GITHUB_OUTPUT"
          echo "prompt-file=${dir}/prompt.md" >> "$GITHUB_OUTPUT"
          if [ -n "$DARIO_IMAGE" ]; then
            printf 'DARIO_API_KEY=%s\nDARIO_REFRESH_LOCK_URL=%s\nDARIO_REFRESH_LOCK_TOKEN=%s\nDARIO_POOL_SHARED_ACCOUNTS=1\nDARIO_POOL_SHARED_STATE=1\n' "$key" "$DARIO_LOCK_URL" "$DARIO_LOCK_TOKEN" > "${dir}/dario.env"
            echo "dario-env-file=${dir}/dario.env" >> "$GITHUB_OUTPUT"
            echo "the review runs on GitHub's runner ${HOSTED_RUNNER}, through a dario sidecar with the seats of ${DARIO_LOCK_URL}, and the caller's rubric"
          else
            echo "the review runs on GitHub's runner ${HOSTED_RUNNER}, against ${MODEL_URL}, with the caller's key and rubric"
          fi

      # A self-hosted runner carries the node the review needs; GitHub's runner gets it here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.hosted-runner != ''
        with:
          node-version: 22

      # A dispatch runs the default branch's workflow files, which is the only reason the ops tick trusts
      # its verdict, so it must be a workflow_dispatch on the default branch. The PR it names must be
      # open, not a draft and at the head given. A head in a fork is allowed here, and only here:
      # the step says so in its `fork` output, and only once a job of a pull_request run for that
      # head has run on a runner and finished. A run held at the contributor gate, or cancelled or
      # skipped there, has no such job, whatever its conclusion. Every check is made before the PR's
      # code is fetched; a failed read fails the run. The script goes to node through a quoted
      # heredoc, so no quote in it can end a shell string early.
      - name: Check the dispatched PR
        if: inputs.pr != ''
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
            const { EVENT_NAME, REF, DEFAULT_BRANCH, REPO, PR, HEAD_SHA } = process.env;
            const fail = (why) => { console.log(`::error::${why}`); process.exit(1); };
            if (EVENT_NAME !== "workflow_dispatch") fail(`a pr input is taken only on workflow_dispatch, not ${EVENT_NAME}`);
            if (!DEFAULT_BRANCH || REF !== `refs/heads/${DEFAULT_BRANCH}`) fail(`a dispatch must run on the default branch ${DEFAULT_BRANCH}, not ${REF}`);
            if (!/^[1-9][0-9]*$/.test(PR)) fail(`pr must be a pull request number; got ${JSON.stringify(PR)}`);
            if (!/^[0-9a-f]{40}$/.test(HEAD_SHA)) fail(`head must be the full 40-character commit sha to review; got ${JSON.stringify(HEAD_SHA)}`);
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            const read = async (path) => {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const res = await fetch(`https://api.github.com${path}`, { headers });
                  if (res.ok) return await res.json();
                  console.log(`attempt ${attempt}: HTTP ${res.status}`);
                } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
                if (attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
              }
              return null;
            };
            const pr = await read(`/repos/${REPO}/pulls/${PR}`);
            if (!pr) fail(`could not read ${REPO}#${PR}`);
            if (pr.state !== "open") fail(`${REPO}#${PR} is ${pr.state}`);
            if (pr.draft) fail(`${REPO}#${PR} is a draft`);
            if (pr.head?.sha !== HEAD_SHA) fail(`${REPO}#${PR} is at ${String(pr.head?.sha).slice(0, 7)}, not ${HEAD_SHA.slice(0, 7)}; dispatch again at its head`);
            const fork = pr.head?.repo?.full_name !== REPO;
            if (fork) {
              const headRepo = pr.head?.repo?.full_name;
              if (!headRepo) fail(`${REPO}#${PR} has no readable head repository`);
              // The contributor gate: a first-time contributor's workflows wait for "Approve and run".
              // A run held there reports action_required; one cancelled or skipped there completes
              // with that conclusion having run nothing. So a run's conclusion is not evidence that
              // a maintainer let the head run: only a job that ran on a runner and finished, in a
              // pull_request run for this head from the PR's head repository, is. Reading the head
              // before that would review code nobody has looked at.
              const listed = await read(`/repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100`);
              if (!listed) fail(`could not list the pull_request runs at ${HEAD_SHA.slice(0, 7)}`);
              const runs = (listed.workflow_runs ?? []).filter((w) => Number.isInteger(w.id) && w.head_sha === HEAD_SHA && w.head_repository?.full_name === headRepo);
              let ran = false;
              for (const w of runs) {
                const listedJobs = await read(`/repos/${REPO}/actions/runs/${w.id}/jobs?filter=all&per_page=100`);
                if (!listedJobs) fail(`could not list the jobs of run ${w.id}`);
                ran = (listedJobs.jobs ?? []).some((j) => j.runner_name && j.started_at && (j.conclusion === "success" || j.conclusion === "failure"));
                if (ran) break;
              }
              if (!ran) fail(`${REPO}#${PR} is a fork PR whose workflows at ${HEAD_SHA.slice(0, 7)} have not run (held or cancelled at the contributor gate, or none yet); not reviewed until a maintainer lets them run`);
            }
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, `fork=${fork ? "true" : "false"}\n`);
            console.log(`${REPO}#${PR} is open and at ${HEAD_SHA.slice(0, 7)}${fork ? `, head in ${pr.head.repo.full_name} (a fork, read only)` : ", in this repository"}`);
          JS

      - name: Fetch the review script from ci-repo
        uses: askalf/ci/actions/checkout-with-retry@f0be7010038c63c66f4a341d0fd548edf1208c7c # main 2026-11-13, askalf/ci#219
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.redline-ref }}
          path: .redline
          sparse-checkout: scripts/redline
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the PR head to read
        if: steps.pr.outputs.fork != 'true'
        uses: askalf/ci/actions/checkout-with-retry@f0be7010038c63c66f4a341d0fd548edf1208c7c # main 2026-11-13, askalf/ci#219
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # A fork head is fetched from this repository's own pull ref (GitHub mirrors every PR head
      # there), so nothing is read from the fork itself, and the fetched commit must be the sha
      # the ops tick named. The checkout writes symlinks as plain files: a link pointing out of the
      # checkout becomes text, and the review's tools refuse any path that resolves outside it
      # anyway. No hooks exist in a fresh repository, no submodule is fetched, nothing runs.
      - name: Fetch the fork head to read
        if: steps.pr.outputs.fork == 'true'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm -rf pr && mkdir pr
          git -C pr init -q
          git -C pr remote add origin "https://github.com/${REPO}.git"
          git -C pr fetch -q --depth 1 --no-tags origin "refs/pull/${PR}/head"
          at="$(git -C pr rev-parse FETCH_HEAD)"
          if [ "$at" != "$HEAD_SHA" ]; then
            echo "::error::refs/pull/${PR}/head is at ${at}, not ${HEAD_SHA}: the PR moved; dispatch again at its head"
            exit 1
          fi
          git -C pr -c core.symlinks=false checkout -q --detach FETCH_HEAD
          echo "fork head ${HEAD_SHA} checked out to read"

      # The sidecar: dario from the pinned image, published on the runner's loopback only, started
      # with the file the runner check wrote, so no secret is in this step or on a command line.
      # dario answers /health with 200 once it can serve, which it can as soon as the registry has
      # given it a seat. It is asked every 2 s, each try cut off at 3 s, and no try starts once a
      # minute has passed. A container that stopped, or one still not ready by then, fails the
      # review with the container's last lines: an empty registry and a wrong token end here.
      - name: Start the dario sidecar
        if: inputs.dario-image != ''
        env:
          DARIO_IMAGE: ${{ inputs.dario-image }}
          DARIO_ENV_FILE: ${{ steps.where.outputs.dario-env-file }}
        run: |
          set -euo pipefail
          docker rm -f -v redline-dario >/dev/null 2>&1 || true
          docker run -d --name redline-dario --env-file "$DARIO_ENV_FILE" -p 127.0.0.1:3456:3456 "$DARIO_IMAGE" >/dev/null
          deadline=$((SECONDS + 60))
          for attempt in $(seq 1 30); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            if curl -fsS -o /dev/null -m 3 http://127.0.0.1:3456/health; then
              echo "the dario sidecar is ready (attempt ${attempt})"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' redline-dario 2>/dev/null)" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "::error::the dario sidecar did not become ready: check the lock service's address and token, and that its registry holds a seat"
          docker logs --tail 40 redline-dario 2>&1 || true
          exit 1

      - name: Review
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
          REDLINE_REREAD: ${{ inputs.pr != '' && inputs.reread && '1' || '0' }}
          REDLINE_FORK: ${{ steps.pr.outputs.fork == 'true' && '1' || '0' }}
          CHECKOUT: ${{ github.workspace }}/pr
          GH_READ_TOKEN: ${{ github.token }}
          REDLINE_CI_REPO: ${{ inputs.ci-repo }}
          REDLINE_REVIEWER_LOGIN: ${{ inputs.reviewer-login }}
          REDLINE_DISPATCH_ACTOR: ${{ inputs.dispatch-actor }}
          # Hosted mode's two files, written above from the caller's secrets; otherwise the host's.
          REDLINE_ENV_FILE: ${{ steps.where.outputs.env-file || inputs.env-file }}
          # The reviewer's rubric lives on the host, root:<runner group> 640, never in a public
          # repository. The script reads it from this file and has no bundled fallback.
          REDLINE_PROMPT_FILE: ${{ steps.where.outputs.prompt-file || inputs.prompt-file }}
          REDLINE_VERDICT_FILE: ${{ github.workspace }}/redline-verdict/verdict.json
        run: node .redline/scripts/redline/review.mjs

      # The verdict goes up whether the review passed or failed; a run that built no review (skipped,
      # already reviewed, or errored) leaves no file and uploads nothing.
      - name: Upload the verdict
        if: always() && hashFiles('redline-verdict/verdict.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redline-verdict
          path: redline-verdict/verdict.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # The second lens: the same script and the same head, read as the second account with the
      # host's second env file and rubric, only when everything above passed (the review approved,
      # or found the head already approved). It may fail without failing the job: the job's result
      # is the first review's verdict, which the post and the ops tick read from the run's
      # conclusion. Its own timeout keeps a stalled second read from cancelling the job, which
      # would leave the first verdict unposted.
      - name: Second lens
        id: second
        if: success() && inputs.second-reviewer-login != ''
        continue-on-error: true
        timeout-minutes: 19
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
          REDLINE_REREAD: ${{ inputs.pr != '' && inputs.reread && '1' || '0' }}
          REDLINE_FORK: ${{ steps.pr.outputs.fork == 'true' && '1' || '0' }}
          CHECKOUT: ${{ github.workspace }}/pr
          GH_READ_TOKEN: ${{ github.token }}
          REDLINE_CI_REPO: ${{ inputs.ci-repo }}
          REDLINE_LENS: second
          REDLINE_PIN_APPROVAL: '1'
          REDLINE_REVIEWER_LOGIN: ${{ inputs.second-reviewer-login }}
          REDLINE_DISPATCH_ACTOR: ${{ inputs.dispatch-actor }}
          REDLINE_ENV_FILE: ${{ inputs.second-env-file }}
          REDLINE_PROMPT_FILE: ${{ inputs.second-prompt-file }}
          REDLINE_VERDICT_FILE: ${{ github.workspace }}/redline-verdict-second/verdict.json
        run: node .redline/scripts/redline/review.mjs

      # Only when the step ran: a file an earlier job left in the workspace is not this run's.
      # An upload that fails must not fail the job either: the first verdict is already up, and a
      # failed job would disagree with its approval and leave it unposted.
      - name: Upload the second lens's verdict
        if: always() && steps.second.outcome != 'skipped' && hashFiles('redline-verdict-second/verdict.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redline-verdict-second
          path: redline-verdict-second/verdict.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Remove the checkouts
        if: always()
        run: rm -rf pr .redline redline-verdict redline-verdict-second "${RUNNER_TEMP}/redline-hosted"

      # The container goes with its anonymous volume, which held the seats' credentials.
      - name: Stop the dario sidecar
        if: always() && inputs.dario-image != ''
        run: docker rm -f -v redline-dario >/dev/null 2>&1 || true
