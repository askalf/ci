# Redline's post: puts a finished Redline run's verdict on its pull request as sprayberry-redline.
# Each reviewed repo calls this from its own redline-post.yml, on workflow_run of its Redline
# workflow, and passes its REDLINE_REVIEWER_TOKEN secret as reviewer-token.
#
# The review job never holds that token: it runs the workflow files a pull request brings with it
# and leaves verdict.json with posted: false. A workflow_run job always runs the default branch's
# copy of its workflow file, never a pull request's, so a pull request cannot change what this job
# runs or where its secret goes until that change is reviewed and merged. The post script
# (scripts/redline/post.mjs, fetched at redline-ref) reads every fact it judges from the GitHub API
# with the read-only workflow token and posts only when every rule holds; its header lists them.
#
# It runs on GitHub's runners: a fresh machine, never a self-hosted runner a pull request's job has
# used, holds the token.
#
# The second lens: a caller whose review runs a second lens (redline-review.yml's
# second-reviewer-login) passes the same login here with that account's token as
# second-reviewer-token. The post script then runs once more, for the run's second verdict, under
# the same rules; its header says where they differ.
name: Redline post

on:
  workflow_call:
    inputs:
      redline-ref:
        description: >-
          The full commit sha of ci-repo this workflow is called at, the same sha as the
          caller's uses pin. The post script is fetched at it. It must be a commit on main.
        required: true
        type: string
      ci-repo:
        description: >-
          The repository this workflow and its script come from, as owner/name: askalf/ci, or a
          fork that runs its own copy. The script is fetched from it at redline-ref.
        required: false
        default: askalf/ci
        type: string
      reviewer-login:
        description: >-
          The account whose posted reviews are Redline's: the one whose token the post caller
          passes. A head it already reviewed is not posted again.
        required: false
        default: sprayberry-redline
        type: string
      dispatch-actor:
        description: >-
          The account whose dispatch of the caller's redline.yml on the default branch is a run
          to post: the one that dispatches a review for a head the pull_request run cannot vouch
          for. The review caller passes the same login.
        required: false
        default: askalf
        type: string
      second-reviewer-login:
        description: >-
          The account the second lens's verdict is posted as, the same login the review caller
          passes as second-reviewer-login. Empty, the default, posts no second verdict.
        required: false
        default: ''
        type: string
    secrets:
      reviewer-token:
        description: The token that posts as reviewer-login.
        required: true
      second-reviewer-token:
        description: The token that posts as second-reviewer-login. Read only when that input is set.
        required: false

# actions: read lists and downloads the run's artifact; contents: read reads redline.yml at the
# commit the run used; pull-requests: read reads the PR, its files and its reviews. The post itself
# uses the reviewer token, never this one.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  # The head the run reviewed, the one key every post for that head shares: a pull_request run's
  # commit is the head; a dispatch's commit is the default branch's, so its head is read from its
  # title, `Redline review <owner>/<name>#<pr> @ <head>[ (re-read)]`, the same for a re-read. Any
  # other run gets a key of its own: the post script names no head for it and posts nothing.
  key:
    # Not on a private repository: the reviewer account has no access to one, so there is nothing to
    # post, and on GitHub's runners a private repository's job spends the owner's minutes or, once
    # they are gone, fails at once.
    if: github.event_name == 'workflow_run' && !github.event.repository.private && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      head: ${{ steps.head.outputs.head }}
    steps:
      - name: Name the head the run reviewed
        id: head
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          title_re='^Redline review [A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[1-9][0-9]* @ ([0-9a-f]{40})( \(re-read\))?$'
          head="run-${RUN_ID}"
          if [[ "$EVENT" == pull_request && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            head="$HEAD_SHA"
          elif [[ "$EVENT" == workflow_dispatch && "$TITLE" =~ $title_re ]]; then
            head="${BASH_REMATCH[1]}"
          fi
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "posts for this run share the key ${head}"

  post:
    needs: key
    # Only a run that reached a verdict. A cancelled or skipped run has none to post.
    if: github.event_name == 'workflow_run' && !github.event.repository.private && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One post at a time per repository and reviewed head, whatever mode the run was in, so two
    # runs for one head never both pass the last read of the reviews and both post. Not one group
    # for the whole repository: a group holds one pending job and a newer one cancels it, which
    # would drop the verdict of a different head.
    concurrency:
      group: redline-post-${{ github.repository }}-${{ needs.key.outputs.head }}
      cancel-in-progress: false
    steps:
      # github.job_workflow_sha is not available to expressions, so the caller passes the sha it
      # pins as redline-ref. It must be a full sha, so it cannot name a moving branch or tag, and a
      # commit on main, so the script that holds the token is always one main has merged.
      - name: Check the post ref is a full commit sha
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
        run: |
          if ! [[ "$REDLINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::redline-ref must be the full 40-character commit sha the caller pins; got '${REDLINE_REF}'"
            exit 1
          fi

      - name: Check the post ref is on main of ci-repo
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
          CI_REPO: ${{ inputs.ci-repo }}
          GH_READ_TOKEN: ${{ github.token }}
        # main is ahead of or identical to the ref exactly when the ref is on main. A failed read
        # is retried, then fails the run: it is never taken as a pass.
        run: |
          node --input-type=module -e '
            const ref = process.env.REDLINE_REF;
            const repo = process.env.CI_REPO;
            if (!/^[A-Za-z0-9-]+[/][A-Za-z0-9._-]+$/.test(repo)) { console.log(`::error::ci-repo must be owner/name; got ${JSON.stringify(repo)}`); process.exit(1); }
            const url = `https://api.github.com/repos/${repo}/compare/${ref}...main`;
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            let status = "";
            for (let attempt = 1; attempt <= 3 && !status; attempt++) {
              try {
                const res = await fetch(url, { headers });
                if (res.ok) status = String((await res.json()).status ?? "");
                else console.log(`attempt ${attempt}: HTTP ${res.status}`);
              } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
              if (!status && attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
            }
            if (status === "ahead" || status === "identical") { console.log(`redline-ref ${ref} is on main`); process.exit(0); }
            console.log(status
              ? `::error::redline-ref ${ref} is not a commit on ${repo} main (${status})`
              : `::error::could not compare redline-ref ${ref} with ${repo} main`);
            process.exit(1);
          '

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the post script from ci-repo
        uses: askalf/ci/actions/checkout-with-retry@19e815912eb0dc85202723bb42c0e76f4786c157 # main 2026-11-11, askalf/ci#205
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.redline-ref }}
          path: .redline
          sparse-checkout: scripts/redline
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Exit 0 when the verdict was posted, was not one to post, or was refused (with a warning:
      # our ops automation hands a refused head to a reviewer). Exit 1 when a read or the post
      # failed, so a re-run of this run decides again.
      - name: Post the verdict
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_READ_TOKEN: ${{ github.token }}
          REDLINE_REVIEWER_TOKEN: ${{ secrets.reviewer-token }}
          REDLINE_CI_REPO: ${{ inputs.ci-repo }}
          REDLINE_REVIEWER_LOGIN: ${{ inputs.reviewer-login }}
          REDLINE_DISPATCH_ACTOR: ${{ inputs.dispatch-actor }}
        run: node .redline/scripts/redline/post.mjs

      # The run's second verdict, when the caller runs a second lens. It is tried whatever the
      # first post came to, since each verdict is judged and posted on its own; the same exit codes.
      - name: Post the second lens's verdict
        if: ${{ !cancelled() && inputs.second-reviewer-login != '' }}
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_READ_TOKEN: ${{ github.token }}
          REDLINE_LENS: second
          REDLINE_REVIEWER_TOKEN: ${{ secrets.second-reviewer-token }}
          REDLINE_CI_REPO: ${{ inputs.ci-repo }}
          REDLINE_REVIEWER_LOGIN: ${{ inputs.second-reviewer-login }}
          REDLINE_DISPATCH_ACTOR: ${{ inputs.dispatch-actor }}
        run: node .redline/scripts/redline/post.mjs
