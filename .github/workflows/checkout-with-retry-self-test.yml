# Proves the checkout-with-retry action on a runner, on every pull request. Three jobs:
#
# `checkout` runs the action from this checkout as a caller would, a whole checkout and a
# single-file sparse one, each asserted on disk: the inputs are forwarded and a healthy checkout
# passes through on the first attempt.
#
# `retry` proves the retry paths, which no real checkout can be made to take on demand. A copy of
# the action is written with its three inner actions/checkout steps swapped for a local stub that
# counts its calls and fails the first N of them (N from the matrix, 0 to 3); nothing else in the
# copy changes, the waits included. The job then asserts how many attempts ran and how the action
# ended: N below 3 is N+1 attempts and success, N of 3 is three attempts and failure. The stub and
# the copy are written by the job into the checkout, so a local `uses:` path finds them.
#
# `act` proves the act path. The job fetches the act release box-ci runs, checked against its
# published sum, writes a three-job workflow that checks out through the action as a caller does
# (`uses: askalf/ci/actions/checkout-with-retry@<ref>`, with act's --local-repository pointing that
# repository and ref at this checkout; a `./` action is read from the job's workspace, empty under
# act until a checkout fills it): one job plain, one with a `path`, one with a `ref`. It runs them
# under act in host mode from the checkout's root, as box-ci does: no container, no token, act's
# default actor nektos/act. From act's log it asserts that act stood in for each job's checkout,
# that the plain job's next step found this checkout's files in the workspace, that the `path` job
# and the `ref` job were each warned and the plain one not, and that no attempt ran and no token
# was asked for.
#
# Not path-filtered: a check from a path-filtered workflow never reports on a PR outside its paths.
name: checkout-with-retry self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  checkout:
    # Our own code runs on ci-exec, our non-root one-job runners; a fork's PR and a Dependabot PR
    # run code nobody here wrote, and a fork has no ci-exec runners, so those stay on GitHub's.
    runs-on: ${{ (github.repository != 'askalf/ci' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","ci-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@80ba764507b83a3cfef9b3999a1e981c588396dd # main 2026-10-21, askalf/ci#83
        with:
          persist-credentials: false
      - name: Whole checkout through the action
        uses: ./actions/checkout-with-retry
        with:
          path: whole
          persist-credentials: false
      - name: Single-file sparse checkout through the action
        uses: ./actions/checkout-with-retry
        with:
          path: one-file
          sparse-checkout: actions/checkout-with-retry/action.yml
          sparse-checkout-cone-mode: 'false'
          persist-credentials: false
      - name: Assert both landed
        run: |
          set -euo pipefail
          test -f whole/actions/checkout-with-retry/action.yml
          test -f whole/scripts/redline/pin.mjs
          test -f one-file/actions/checkout-with-retry/action.yml
          test ! -e one-file/scripts
          echo "whole and single-file checkouts through the action OK"

  retry:
    name: retry path, ${{ matrix.failures }} failing attempt(s)
    runs-on: ${{ (github.repository != 'askalf/ci' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","ci-exec"]') }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        failures: [0, 1, 2, 3]
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@80ba764507b83a3cfef9b3999a1e981c588396dd # main 2026-10-21, askalf/ci#83
        with:
          persist-credentials: false
      - name: Write the stub and a copy of the action that calls it
        env:
          FAILURES: ${{ matrix.failures }}
        run: |
          set -euo pipefail
          rm -rf .harness && mkdir -p .harness/stub .harness/retry
          rm -f "$RUNNER_TEMP/attempts"
          printf '%s\n' "$FAILURES" > "$RUNNER_TEMP/failures"
          # The stub takes the inputs the action forwards, so the copy's `with:` blocks are unchanged,
          # and ignores them. Each call is counted in the runner's temp directory, outside the checkout.
          cat > .harness/stub/action.yml <<'STUB'
          name: checkout stub
          description: fails the first N calls (N in $RUNNER_TEMP/failures), counts every call
          inputs:
            ref: {required: false}
            repository: {required: false}
            token: {required: false}
            fetch-depth: {required: false}
            path: {required: false}
            sparse-checkout: {required: false}
            sparse-checkout-cone-mode: {required: false}
            persist-credentials: {required: false}
          runs:
            using: composite
            steps:
              - shell: bash
                run: |
                  n="$(cat "$RUNNER_TEMP/attempts" 2>/dev/null || echo 0)"
                  n=$((n + 1))
                  printf '%s\n' "$n" > "$RUNNER_TEMP/attempts"
                  if [ "$n" -le "$(cat "$RUNNER_TEMP/failures")" ]; then echo "stub: call $n fails"; exit 1; fi
                  echo "stub: call $n succeeds"
          STUB
          # The copy is the action with only its inner checkout swapped for the stub; the pin's
          # version comment goes with it. Exactly four swaps (the act-only step is one, skipped
          # here, as the actor is never nektos/act), or the copy is not the action.
          sed -E 's#uses: actions/checkout@[0-9a-f]{40} *(\# v[0-9.]+)?$#uses: ./.harness/stub#' \
            actions/checkout-with-retry/action.yml > .harness/retry/action.yml
          test "$(grep -c 'uses: ./.harness/stub' .harness/retry/action.yml)" = 4
          ! grep -q 'actions/checkout@' .harness/retry/action.yml
          # Everything but those three lines is the action, byte for byte.
          diff <(grep -v 'uses: actions/checkout@' actions/checkout-with-retry/action.yml) \
               <(grep -v 'uses: ./.harness/stub' .harness/retry/action.yml)
      - name: Run the copy
        id: run
        uses: ./.harness/retry
        continue-on-error: true
        with:
          path: harness-out
          persist-credentials: false
      - name: Assert the attempts and the outcome
        env:
          FAILURES: ${{ matrix.failures }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          attempts="$(cat "$RUNNER_TEMP/attempts")"
          if [ "$FAILURES" -lt 3 ]; then want_attempts=$((FAILURES + 1)); want_outcome=success; else want_attempts=3; want_outcome=failure; fi
          echo "failures=$FAILURES attempts=$attempts outcome=$OUTCOME (want $want_attempts, $want_outcome)"
          test "$attempts" = "$want_attempts"
          test "$OUTCOME" = "$want_outcome"

  act:
    name: under act, no attempt runs
    runs-on: ${{ (github.repository != 'askalf/ci' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","ci-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@80ba764507b83a3cfef9b3999a1e981c588396dd # main 2026-10-21, askalf/ci#83
        with:
          persist-credentials: false
      - name: Fetch act, the release box-ci runs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act"
          cd "$RUNNER_TEMP/act"
          curl -fsSL -o act.tgz https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz
          echo '0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0  act.tgz' | sha256sum -c -
          tar -xzf act.tgz act
          ./act --version
      - name: Run a workflow that checks out through the action, under act
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act-wf"
          # The action is named as a caller names it; --local-repository below makes act read
          # askalf/ci at `under-test` from this checkout. (A `./` action cannot be used: act reads it
          # from the job's workspace, which under act is empty until a checkout step fills it.) The
          # step after the action proves act stood in: the workspace holds this checkout's files,
          # copied by act, with no checkout having run.
          cat > "$RUNNER_TEMP/act-wf/under-act.yml" <<'WF'
          on: push
          jobs:
            plain:
              runs-on: ubuntu-latest
              steps:
                - uses: askalf/ci/actions/checkout-with-retry@under-test
                - name: Prove the workspace is the working directory
                  run: test -f actions/checkout-with-retry/action.yml && test -f scripts/redline/pin.mjs && echo "workspace is the working directory"
            pathed:
              runs-on: ubuntu-latest
              steps:
                - uses: askalf/ci/actions/checkout-with-retry@under-test
                  with:
                    path: elsewhere
            reffed:
              runs-on: ubuntu-latest
              steps:
                - uses: askalf/ci/actions/checkout-with-retry@under-test
                  with:
                    ref: release
          WF
          # Host mode, as box-ci runs it: the job runs on this machine, no container. No secret is
          # passed, so the action's token input is empty, as it is in the box-ci lane.
          "$RUNNER_TEMP/act/act" push -W "$RUNNER_TEMP/act-wf/under-act.yml" -P ubuntu-latest=-self-hosted \
            --local-repository "askalf/ci@under-test=$GITHUB_WORKSPACE" \
            --action-cache-path "$RUNNER_TEMP/act-cache" 2>&1 | tee "$RUNNER_TEMP/act.log"
          test "${PIPESTATUS[0]}" = 0
      - name: Assert the act path from the log
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/act.log"
          # Step output in act's log is `[workflow/job] | <line>`; a step's name is not, so a script's
          # text in a name cannot satisfy an assertion, and the job prefix tells the three jobs apart.
          # A forbidden line is an explicit exit: `! grep` is exempt from set -e and would not fail.
          want() { grep -q -- "$2" "$log" || { echo "missing in act's log: $2 ($1)"; exit 1; }; }
          forbid() { if grep -q -- "$2" "$log"; then echo "in act's log, forbidden: $2 ($1)"; exit 1; fi; }
          want 'plain job: act stood in'    '/plain \] *| Checkout stood in by act: the workspace is a copy of the working directory'
          want 'plain job: workspace is the working directory' '/plain \] *| workspace is the working directory'
          forbid 'plain job: no warning for the defaults' '/plain \].*checkout-with-retry under act: path, repository and ref inputs are not honoured'
          want 'pathed job: act stood in'   '/pathed\] *| Checkout stood in by act: the workspace is a copy of the working directory'
          want 'pathed job: warned'         '/pathed\].*checkout-with-retry under act: path, repository and ref inputs are not honoured'
          want 'reffed job: act stood in'   '/reffed\] *| Checkout stood in by act: the workspace is a copy of the working directory'
          want 'reffed job: warned'         '/reffed\].*checkout-with-retry under act: path, repository and ref inputs are not honoured'
          forbid 'no attempt succeeded'     'Checkout succeeded on attempt'
          forbid 'no attempt ran'           'Run Main Checkout (attempt'
          forbid 'no token asked for'       'Input required and not supplied: token'
          echo "under act: act stood in, no attempt ran, no token asked for, the workspace was the working directory, path and ref each warned, the defaults not"
