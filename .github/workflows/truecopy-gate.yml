# Gates the tools Redline's models read with truecopy: the reviewer's (scripts/redline/tools.json,
# written from TOOLS in review.mjs) and the fixer's (scripts/redline/fix-tools.json, from TOOLS in
# fix.mjs), both pinned in truecopy.lock. The chain is code -> manifest (--check) -> lock
# (truecopy verify): a change to a tool fails until it is re-pinned with `truecopy add`, which
# poison-scans it first. The system prompts are not in the lock: they are installed on the runner
# hosts, never in this repository, so there is nothing here to pin.
name: truecopy gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# attestations: read lets the action check the Sigstore attestation of the truecopy tarball
# before installing it.
permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: verify pinned reviewer surface
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on ci-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no ci-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/ci' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","ci-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@d69adc144649c5afaae0a143c74484fba482bbcb # main 2026-10-22, askalf/ci#98
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: tools.json and fix-tools.json match TOOLS
        run: node scripts/redline/dump-tools.mjs --check
      - name: truecopy verify
        uses: askalf/truecopy-action@1c751a921d3bacb73f30c66054c7fe293ca6743d # v1.1.2
        with:
          verify-attestation: 'true'
