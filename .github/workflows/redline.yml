# Redline, the gating code review, as this repo's CI check. The review itself is this repo's own
# redline-review.yml, called at a pinned commit like every other caller does: same-repo PRs only,
# read-only tools, verdict = pass or fail.
name: Redline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: redline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only, and not drafts: gated here as well as in the called workflow, so a
    # fork's code never reaches the self-hosted runner even if the callee changes.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # Pinned so a change to the review workflow reaches this repo only through a reviewed bump here.
    uses: askalf/ci/.github/workflows/redline-review.yml@0c07d9debea4267e98cb01e882c33b7dee65a7a7 # main 2026-09-26
    with:
      redline-ref: 0c07d9debea4267e98cb01e882c33b7dee65a7a7
      runner-label: redline
