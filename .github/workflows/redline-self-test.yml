# Runs Redline's tests on every pull request. The tests read the review and fix scripts, their
# reusable workflows, this repo's callers and the pin bump workflow; they take seconds. `test` is a
# required check on main, and a required check from a path-filtered workflow never reports on a PR
# outside its paths, which then cannot merge.
# The model and GitHub are stubbed; no credentials are used. The prompts the tests hand the scripts
# are the three-line stand-ins under scripts/redline/test-fixtures, never the rubric.
name: Redline self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on ci-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no ci-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/ci' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","ci-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/redline/review.test.mjs
      # The drift-report action's script and the action pin, against a fake gh and git.
      - run: node scripts/drift-report/report.test.mjs
      # The real run-account tests need a second account this job may sudo to. A host that
      # provides one (redline-run, with a sudoers line for the runner's account) lends it; on
      # GitHub's runners, where the job has passwordless sudo, it is made; anywhere else they skip
      # here, and the run-account job below runs them.
      - name: Find or make a run account for the fix tests
        run: |
          if sudo -n -u redline-run -- true 2>/dev/null; then
            echo "REDLINE_TEST_RUN_AS=redline-run" >> "$GITHUB_ENV"
          elif sudo -n true 2>/dev/null; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin redline-run
            command -v setfacl >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q acl; }
            echo "REDLINE_TEST_RUN_AS=redline-run" >> "$GITHUB_ENV"
          else
            echo "::notice::no run account on this runner; the run-account job runs the real run-account tests"
          fi
      - run: node scripts/redline/fix.test.mjs
      # tools.json and fix-tools.json are TOOLS as files; this fails when review.mjs or fix.mjs
      # changed a tool without them.
      - run: node scripts/redline/dump-tools.mjs --check

  # The fix tests against a real second account, on GitHub's runners, where the job has the sudo
  # to make one: the run account's boundary is tested on every PR whichever runner `test` used.
  # Not a required check, so a hosted outage holds no PR.
  run-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Make a run account for the fix tests
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin redline-run
          command -v setfacl >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q acl; }
      - run: node scripts/redline/fix.test.mjs
        env:
          REDLINE_TEST_RUN_AS: redline-run
