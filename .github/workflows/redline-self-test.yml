# Runs Redline's tests on every pull request. The tests read the review and fix scripts, their
# reusable workflows, this repo's callers and the pin bump workflow; they take seconds. `test` is a
# required check on main, and a required check from a path-filtered workflow never reports on a PR
# outside its paths, which then cannot merge.
# The model and GitHub are stubbed; no credentials are used. The prompts the tests hand the scripts
# are the three-line stand-ins under scripts/redline/test-fixtures, never the rubric.
name: Redline self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/redline/review.test.mjs
      - run: node scripts/redline/fix.test.mjs
      # tools.json is TOOLS as a file; it fails here when review.mjs changed a tool without it.
      - run: node scripts/redline/dump-tools.mjs --check
