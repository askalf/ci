# After each Scorecard run: checks that its result reached scorecard.dev, and dispatches Scorecard
# once more when it did not. scorecard-action reports a failed publish as a warning on a green run,
# which is how a badge went stale for fifteen hours on 2026-11-09 with nothing red. The rules are
# scripts/scorecard-publish/check.mjs; the action is pinned and bumped like every other caller's.
# It is a workflow of its own because scorecard.dev accepts results only from a job whose steps it
# recognises, so the check cannot be a step of scorecard.yml.
name: Scorecard publish check

on:
  workflow_run:
    workflows: [Scorecard]
    types: [completed]

permissions: {}

jobs:
  check:
    # A failed run is already red, and a private repository does not publish.
    if: github.event.workflow_run.conclusion == 'success' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # the one dispatch of the Scorecard workflow
    steps:
      - uses: askalf/ci/actions/scorecard-publish-check@bbc8b21262aa211d499601b4222210a2686b7462 # main 2026-11-12, askalf/ci#209
