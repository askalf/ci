# Opens a PR in each Redline caller that moves its pins, and the redline-ref input that names the
# same commit, to the main commit that changed the review or the fix. A caller pins two reusable
# workflows by SHA: redline.yml calls redline-review.yml and redline-fix.yml, where the repository
# has one, calls redline-fix-run.yml. A drift watcher pins a third thing as a step, in whichever
# workflow file it lives: uses: askalf/ci/actions/drift-report@<sha> (the report step). Each pins by
# SHA so a change reaches it only through a reviewed bump there; this writes those bumps
# (scripts/redline/pin.mjs), and each repo's own gate reviews and merges them.
#
# Writing to other repos needs a token GITHUB_TOKEN cannot be: REDLINE_PIN_BUMP_TOKEN, a
# fine-grained token owned by askalf with Contents, Pull requests and Workflows read/write on the
# repos in CALLERS. Workflows is needed because the pin lives in .github/workflows/, and GitHub
# refuses a change to a workflow file from a token without it. A PR opened with GITHUB_TOKEN would
# also start no CI, so no required check would report.
# Without the secret the job says so and stops, green.
#
# Each bump PR is a review in every caller, so bumps are batched: the hourly run bumps to the newest
# main commit that changed what a caller runs, once that commit has been quiet for QUIET_MINUTES, so a
# burst of merges is one wave. A dispatch bumps at once, for a fix that cannot wait, unless it sets
# wait-for-quiet: the host's clock dispatches it that way hourly, since GitHub drops scheduled runs. An open bump PR
# that already proposes the picked commit is left alone, so its review and checks are not restarted.
name: Redline pin bump

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      wait-for-quiet:
        description: 'Wait, as the hourly schedule does, until the newest change has been quiet for QUIET_MINUTES'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: redline-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    # Schedule and dispatch only, so only our own code runs here: on ci-exec, a pin bump
    # reaches the callers while GitHub's hosted queue is down.
    runs-on: [self-hosted, ci-exec]
    timeout-minutes: 10
    # A fork repository has no ci-exec runners and no bump to make: the job runs here only.
    if: github.repository == 'askalf/ci'
    permissions:
      contents: read
    env:
      # Every repo whose .github/workflows/redline.yml calls this repository's redline-review.yml,
      # this repository included: its own caller moves through a bump PR like every other one.
      CALLERS: >-
        askalf/ci askalf/askalf askalf/dario askalf/amnesia askalf/browser-bridge askalf/redstamp
        askalf/truecopy askalf/truecopy-action askalf/cordon askalf/plumbline askalf/checkout-with-retry
      # A bot-shaped branch opened by askalf: the fleet lanes treat it as a bot PR.
      BRANCH: bot/redline-pin
      # The review caller is in every repo; the fix caller only where the fix lane is wired, so a
      # missing one is skipped, not an error.
      CALLER_PATHS: >-
        .github/workflows/redline.yml .github/workflows/redline-fix.yml
      # What a caller runs: the scripts the reusable workflows fetch, and the workflows. The tests,
      # their fixtures and the README change nothing a caller runs, so they move no pin.
      PIN_PATHS: >-
        scripts/redline
        :(exclude)scripts/redline/*.test.mjs
        :(exclude)scripts/redline/test-fixtures
        :(exclude)scripts/redline/README.md
        scripts/drift-report
        :(exclude)scripts/drift-report/*.test.mjs
        :(exclude)scripts/drift-report/README.md
        actions/drift-report
        .github/workflows/redline-review.yml
        .github/workflows/redline-fix-run.yml
        .github/workflows/redline-pin-bump.yml
      QUIET_MINUTES: 60
    steps:
      - name: Check for the token
        id: guard
        env:
          TOKEN: ${{ secrets.REDLINE_PIN_BUMP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::REDLINE_PIN_BUMP_TOKEN is not set; no bump PRs opened. Bump the redline-review.yml and redline-fix-run.yml pins in each caller by hand."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the pin rewriter and main's history
        if: steps.guard.outputs.ok == 'true'
        uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          fetch-depth: 0
          sparse-checkout: scripts/redline/pin.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pick the commit to pin
        if: steps.guard.outputs.ok == 'true'
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WAIT_FOR_QUIET: ${{ inputs.wait-for-quiet }}
        run: |
          set -euo pipefail
          # Unquoted on purpose: PIN_PATHS is a list of pathspecs, none with a space; set -f keeps
          # the shell from globbing them, so git reads each pattern itself. --first-parent walks
          # main's own history, so a merge is picked with the time it landed, not the time of the
          # merged branch's last commit.
          set -f
          # shellcheck disable=SC2086
          read -r sha at < <(git log -1 --first-parent --format='%H %ct' HEAD -- $PIN_PATHS)
          set +f
          age=$(( ( $(date +%s) - at ) / 60 ))
          echo "newest change a caller runs: ${sha:0:7}, ${age} minutes ago"
          if { [ "$EVENT" = schedule ] || [ "${WAIT_FOR_QUIET:-false}" = true ]; } && [ "$age" -lt "$QUIET_MINUTES" ]; then
            echo "::notice::${sha:0:7} landed ${age} minutes ago; the bump waits for ${QUIET_MINUTES} quiet minutes, so a burst of merges is one wave"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pick.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Open or update a bump PR in each caller
        if: steps.pick.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.REDLINE_PIN_BUMP_TOKEN }}
          SHA: ${{ steps.pick.outputs.sha }}
          SOURCE: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          day="$(date -u +%Y-%m-%d)"
          # The PR that landed this commit, for the pin's trailing comment.
          pr="$(gh api "repos/${SOURCE}/commits/${SHA}/pulls" --jq '.[0].number // empty' || true)"
          note="main ${day}"
          if [ -n "$pr" ]; then note="${note}, ${SOURCE}#${pr}"; fi
          pattern="uses: ${SOURCE}/.github/workflows/redline-(review|fix-run).yml@[0-9a-f]{40}"
          title="ci: bump Redline to ${SOURCE}@${short}"
          body="Moves the pinned ${SOURCE} calls and their redline-ref inputs, and every drift-report action pin, to ${SOURCE}@${SHA}, the main commit that last changed the review, the fix or the report step (${note}). The scripts are fetched at that same commit. The pins are the only change."

          # A path as the Contents API takes it: each segment percent-encoded, so a workflow named
          # with a space, a # or a ? is read and written as one whole path.
          uri() { node -e 'process.stdout.write(process.argv[1].split("/").map(encodeURIComponent).join("/"))' "$1"; }

          # One caller repository. Any command that fails ends this repository's bump (set -e
          # holds inside the subshell it runs in), never the loop: the next repository is still bumped.
          # The files to rewrite are kept in arrays, so a path is never split on its spaces.
          bump() {
            local repo="$1" base tip path at current updated blob bad=0 unread=0 bumped=0 open name listing pins caller
            local -a todo=() atodo=() names=()
            base="$(gh api "repos/${repo}" --jq .default_branch)"
            tip="$(gh api "repos/${repo}/git/ref/heads/${base}" --jq .object.sha)"
            # Which caller files need the new pin. The review caller must exist; the fix caller may not.
            for path in $CALLER_PATHS; do
              at="$(uri "$path")"
              if ! current="$(gh api "repos/${repo}/contents/${at}?ref=${tip}" --jq .content 2>/dev/null | base64 -d)"; then
                if [ "$path" = ".github/workflows/redline.yml" ]; then echo "::error::${repo}: no ${path}"; bad=1; else echo "no ${path}"; fi
                continue
              fi
              if ! printf '%s\n' "$current" | grep -Eq "$pattern"; then
                echo "::error::${repo}: ${path} has no pinned ${SOURCE} call"; bad=1; continue
              fi
              if printf '%s\n' "$current" | grep -Eq "redline-(review|fix-run).yml@${SHA}" && printf '%s\n' "$current" | grep -q "redline-ref: ${SHA}"; then
                echo "${path} already at ${short}"; continue
              fi
              todo+=("$path")
            done
            # The drift-report action is pinned as a step in whichever workflow file a watcher is, so
            # those files are found by reading the directory, not from a list. A file whose every pin is
            # already at the commit needs nothing. A directory or file that could not be read is not a
            # file without pins: it is reported, and this repository's bump stops for this run, so a
            # transient failure never opens a PR that moves some of the pins and reports success. The
            # pins are found by pin.mjs --action-pins, so a line is a pin here exactly when pin.mjs
            # --action rewrites it. The listing is one name per line, read whole, spaces and all.
            if ! listing="$(gh api "repos/${repo}/contents/.github/workflows?ref=${tip}" --jq '.[] | select(.type == "file") | .name')"; then
              echo "::error::${repo}: could not list .github/workflows at ${tip:0:7}"; unread=1; listing=""
            fi
            if [ -n "$listing" ]; then mapfile -t names <<< "$listing"; fi
            for name in "${names[@]}"; do
              path=".github/workflows/${name}"
              for caller in $CALLER_PATHS; do
                if [ "$caller" = "$path" ]; then continue 2; fi
              done
              at="$(uri "$path")"
              if ! current="$(gh api "repos/${repo}/contents/${at}?ref=${tip}" --jq .content | base64 -d)"; then
                echo "::error::${repo}: could not read ${path} at ${tip:0:7}"; unread=1; continue
              fi
              if ! pins="$(printf '%s\n' "$current" | node scripts/redline/pin.mjs --action-pins)"; then
                echo "::error::${repo}: could not read the action pins in ${path}"; unread=1; continue
              fi
              [ -n "$pins" ] || continue
              if ! printf '%s\n' "$pins" | grep -vqx "$SHA"; then echo "${path} already at ${short}"; continue; fi
              atodo+=("$path")
            done
            if [ "$unread" -ne 0 ]; then echo "::error::${repo}: not every workflow could be read; nothing is bumped here this run"; return 1; fi
            if [ "${#todo[@]}" -eq 0 ] && [ "${#atodo[@]}" -eq 0 ]; then return "$bad"; fi
            # An open bump PR that already proposes this commit in every file that needs it is left
            # alone: resetting its branch would restart its review and checks for no change.
            open="$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$open" ]; then
              local carried=1
              for path in "${todo[@]}"; do
                at="$(uri "$path")"
                if ! current="$(gh api "repos/${repo}/contents/${at}?ref=${BRANCH}" --jq .content 2>/dev/null | base64 -d)"; then carried=0; break; fi
                if ! printf '%s\n' "$current" | grep -Eq "redline-(review|fix-run).yml@${SHA}" || ! printf '%s\n' "$current" | grep -q "redline-ref: ${SHA}"; then carried=0; break; fi
              done
              for path in "${atodo[@]}"; do
                at="$(uri "$path")"
                if ! current="$(gh api "repos/${repo}/contents/${at}?ref=${BRANCH}" --jq .content 2>/dev/null | base64 -d)"; then carried=0; break; fi
                if ! pins="$(printf '%s\n' "$current" | node scripts/redline/pin.mjs --action-pins)" || [ -z "$pins" ]; then carried=0; break; fi
                if printf '%s\n' "$pins" | grep -vqx "$SHA"; then carried=0; break; fi
              done
              if [ "$carried" -eq 1 ]; then echo "#${open} already proposes ${short}"; return "$bad"; fi
            fi
            # The bump branch is this job's alone: reset it to the default branch tip each time,
            # so an open bump PR carries exactly the newest pin, one commit per caller file.
            if gh api "repos/${repo}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${repo}/git/refs/heads/${BRANCH}" -f sha="$tip" -F force=true >/dev/null
            else
              gh api -X POST "repos/${repo}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$tip" >/dev/null
            fi
            # One commit per file: the Redline callers through pin.mjs, the watchers through pin.mjs --action.
            rewrite() {
              local path="$1" what="$2" at; shift 2
              at="$(uri "$path")"
              current="$(gh api "repos/${repo}/contents/${at}?ref=${BRANCH}" --jq .content | base64 -d)"
              if ! updated="$(printf '%s\n' "$current" | node scripts/redline/pin.mjs "$@" "$SHA" "$note")"; then
                echo "::error::${repo}: could not rewrite ${path}"; bad=1; return
              fi
              blob="$(gh api "repos/${repo}/contents/${at}?ref=${BRANCH}" --jq .sha)"
              printf '%s\n' "$updated" > caller.yml
              gh api -X PUT "repos/${repo}/contents/${at}" \
                -f message="ci: bump ${what} to ${SOURCE}@${short} in $(basename "$path")" \
                -f content="$(base64 -w0 caller.yml)" \
                -f branch="$BRANCH" -f sha="$blob" >/dev/null
              echo "${path} bumped"
              bumped=$((bumped + 1))
            }
            for path in "${todo[@]}"; do rewrite "$path" Redline; done
            for path in "${atodo[@]}"; do rewrite "$path" drift-report --action; done
            # A branch with no new commit has nothing to propose.
            if [ "$bumped" -eq 0 ]; then return 1; fi
            open="$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$open" ]; then
              # The body names the commit, so it moves with the title.
              gh pr edit "$open" --repo "$repo" --title "$title" --body "$body" >/dev/null
              echo "updated #${open}"
            else
              gh pr create --repo "$repo" --base "$base" --head "$BRANCH" --title "$title" --body "$body"
            fi
            return "$bad"
          }

          failed=0
          for repo in $CALLERS; do
            echo "== ${repo}"
            set +e
            ( set -e; bump "$repo" )
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then echo "::error::${repo}: the bump did not complete (exit ${rc})"; failed=1; fi
          done
          exit "$failed"
