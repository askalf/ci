# Redline build: a ticket turned into a change, as a CI job. Each repository calls this from its own
# build caller (workflow_dispatch; the ops tick dispatches it with the ticket, the commit of the
# default branch the work starts from, and the ticket's title and brief). The job checks out that
# commit on the repository's own non-root exec runner, lets the build script edit and test inside
# it, and uploads the result as the redline-build artifact: build.json, notes.md and, when there is
# a change, description.md and build.bundle (one commit on top of the base). The job's status is
# the outcome: 0 for fixed, 1 for anything else.
# Nothing here pushes, opens a pull request or comments, and no token that could is on the runner:
# the ops tick verifies the artifact, pushes the commit as a new branch and opens the pull request
# with the token it already holds. Nothing under .github/ is in the commit, whatever the ticket
# asks: the build's write tool writes nothing there, and a change a command makes there in the
# checkout is left out of the commit, and so out of the checkout the tests run in.
# The title and the brief are a ticket's text. They are in the build step's environment, which the
# run's log prints, so on a public repository they are public.
# The model is reached through FIX_ENV_FILE, which only the exec account that runs this job can
# read: never an account that runs untrusted code, and never the run account the checkout's own
# commands use (see scripts/redline/README.md).
# The caller's runs-on is [self-hosted, <repo>-exec]; a job that uses a reusable workflow takes no
# runs-on of its own, so the caller passes the label as runner-label.
name: Redline build run

on:
  workflow_call:
    inputs:
      runner-label:
        description: The caller's exec runner label, <repo>-exec.
        required: true
        type: string
      redline-ref:
        description: >-
          The full commit sha of ci-repo this workflow is called at, the same sha as the
          caller's uses pin. The build script is fetched at it. It must be a commit on main.
        required: true
        type: string
      ci-repo:
        description: >-
          The repository this workflow and its script come from, as owner/name: askalf/ci, or a
          fork that runs its own copy. The script is fetched from it at redline-ref.
        required: false
        default: askalf/ci
        type: string
      env-file:
        description: >-
          The host file with the fix lane's model endpoint and settings, which the build lane shares, readable by the exec account only. An absolute path on the runner host.
        required: false
        default: /etc/askalf/fix-exec.env
        type: string
      prompt-file:
        description: >-
          The host file with the builder's prompt. An absolute path on the runner host; it is never committed.
        required: false
        default: /etc/askalf/build-prompt.md
        type: string
      ticket:
        description: The ticket's id, a ULID.
        required: true
        type: string
      base:
        description: The full commit sha of the default branch the work starts from.
        required: true
        type: string
      title:
        description: The ticket's title, one line of at most 140 characters. It shows in the run's log.
        required: true
        type: string
      brief:
        description: The task, the ticket's brief, at most 6,000 characters. It shows in the run's log.
        required: true
        type: string
      dry_run:
        description: Compute the change and upload its diff; no commit, no bundle.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    timeout-minutes: 60
    steps:
      # github.job_workflow_sha is not available to expressions, so the caller passes the sha it
      # pins as redline-ref. It must be a full sha, so it cannot name a moving branch or tag, and
      # a commit on main, so a branch cannot point the build at a script that was never merged.
      - name: Check the review ref is a full commit sha
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
        run: |
          if ! [[ "$REDLINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::redline-ref must be the full 40-character commit sha the caller pins; got '${REDLINE_REF}'"
            exit 1
          fi

      # The ticket id is a ULID (its first character 0 to 7, as a 128-bit value's must be) and the
      # base a full sha, before anything is fetched. The title and the brief are read by build.mjs
      # alone, which refuses a run whose text is missing or too long.
      - name: Check the ticket and the base
        env:
          TICKET: ${{ inputs.ticket }}
          BASE: ${{ inputs.base }}
          # The C locale: a range in a pattern is the ASCII range, so lower case never passes for upper.
          LC_ALL: C
        run: |
          if ! [[ "$TICKET" =~ ^[0-7][0-9A-HJKMNP-TV-Z]{25}$ ]]; then
            echo "::error::ticket must be a ticket id, a ULID: 26 characters of Crockford base32 in upper case, the first 0 to 7"
            exit 1
          fi
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::base must be the full 40-character commit sha the work starts from; got '${BASE}'"
            exit 1
          fi

      - name: Check the review ref is on main of ci-repo
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
          CI_REPO: ${{ inputs.ci-repo }}
          GH_READ_TOKEN: ${{ github.token }}
        # main is ahead of or identical to the ref exactly when the ref is on main. A failed read
        # is retried, then fails the job: it is never taken as a pass.
        run: |
          node --input-type=module -e '
            const ref = process.env.REDLINE_REF;
            const repo = process.env.CI_REPO;
            if (!/^[A-Za-z0-9-]+[/][A-Za-z0-9._-]+$/.test(repo)) { console.log(`::error::ci-repo must be owner/name; got ${JSON.stringify(repo)}`); process.exit(1); }
            const url = `https://api.github.com/repos/${repo}/compare/${ref}...main`;
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            let status = "";
            for (let attempt = 1; attempt <= 3 && !status; attempt++) {
              try {
                const res = await fetch(url, { headers });
                if (res.ok) status = String((await res.json()).status ?? "");
                else console.log(`attempt ${attempt}: HTTP ${res.status}`);
              } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
              if (!status && attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
            }
            if (status === "ahead" || status === "identical") { console.log(`redline-ref ${ref} is on main`); process.exit(0); }
            console.log(status
              ? `::error::redline-ref ${ref} is not a commit on ${repo} main (${status})`
              : `::error::could not compare redline-ref ${ref} with ${repo} main`);
            process.exit(1);
          '

      # The base is a commit of this repository's default branch: the default branch is ahead of it
      # or at it. A sha the checkout would reach on another branch (unmerged code) fails here, before
      # anything is fetched. A failed read is retried, then fails the job: it is never taken as a pass.
      - name: Check the base is on the default branch
        env:
          BASE: ${{ inputs.base }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            const { BASE: base, REPO: repo, DEFAULT_BRANCH: branch } = process.env;
            if (!branch) { console.log("::error::the default branch name could not be read"); process.exit(1); }
            // Any name git allows, encoded as one ref: a name holds no "..", so the separator is never in it.
            const url = `https://api.github.com/repos/${repo}/compare/${base}...${encodeURIComponent(branch)}`;
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            let status = "";
            for (let attempt = 1; attempt <= 3 && !status; attempt++) {
              try {
                const res = await fetch(url, { headers });
                if (res.ok) status = String((await res.json()).status ?? "");
                else console.log(`attempt ${attempt}: HTTP ${res.status}`);
              } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
              if (!status && attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
            }
            if (status === "ahead" || status === "identical") { console.log(`base ${base} is on ${branch}`); process.exit(0); }
            console.log(status
              ? `::error::base ${base} is not a commit on ${branch} (${status})`
              : `::error::could not compare base ${base} with ${branch}`);
            process.exit(1);
          '

      - name: Fetch the build script from ci-repo
        uses: askalf/ci/actions/checkout-with-retry@1d584fe464673b0fa066be22ed089eb3b161a06a # main 2026-11-24, askalf/ci#240
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.redline-ref }}
          path: .redline
          sparse-checkout: scripts/redline
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Fifteen commits deep: the brief shows the model the base's last subjects, whose style the
      # new commit's subject follows.
      - name: Check out the base to build on
        uses: askalf/ci/actions/checkout-with-retry@1d584fe464673b0fa066be22ed089eb3b161a06a # main 2026-11-24, askalf/ci#240
        with:
          ref: ${{ inputs.base }}
          path: work
          fetch-depth: 15
          persist-credentials: false

      # The checkout was asked for the base sha, so this proves only that it landed nowhere else.
      # build.mjs checks it again, and that the checkout is clean, before the model is called.
      - name: Check the checkout is at the base
        env:
          BASE: ${{ inputs.base }}
        run: |
          at="$(git -C work rev-parse HEAD)"
          if [ "$at" != "$BASE" ]; then
            echo "::error::the checkout is at ${at}, not at ${BASE}"
            exit 1
          fi

      # The repository's own test script needs a toolchain; node 22 comes from the exec tier's own
      # tool cache, never from the host.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        env:
          REPO: ${{ github.repository }}
          # Whether the repository is private, as GitHub says it: the lessons read asks for lessons
          # drawn on public repositories only unless it is.
          REPO_PRIVATE: ${{ github.event.repository.private }}
          BUILD_TICKET: ${{ inputs.ticket }}
          BUILD_BASE: ${{ inputs.base }}
          # A ticket's text, written by someone else. It travels as environment, never as part of a
          # command line, and build.mjs hands it to the model as the task, quoted.
          BUILD_TITLE: ${{ inputs.title }}
          BUILD_BRIEF: ${{ inputs.brief }}
          CHECKOUT: ${{ github.workspace }}/work
          REDLINE_CI_REPO: ${{ inputs.ci-repo }}
          # The fix lane's env file: this lane reads the same settings under the same names.
          # Readable by the exec account only; never by an account that runs untrusted code.
          FIX_ENV_FILE: ${{ inputs.env-file }}
          # The builder's prompt, on the host next to the env file with the same owner and mode,
          # never in a public repository. The script reads it from this file, under the name the
          # fix lane's prompt has there, and has no bundled fallback.
          FIX_PROMPT_FILE: ${{ inputs.prompt-file }}
          # Named for this run and attempt: a directory another run left behind is never the one
          # written or uploaded here.
          FIX_OUT: ${{ github.workspace }}/build-out-${{ github.run_id }}-${{ github.run_attempt }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .redline/scripts/redline/build.mjs

      # build.json goes up whatever the outcome; the ops tick reads it to know why there is no bundle.
      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redline-build
          path: build-out-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Remove the checkouts
        if: always()
        env:
          OUT: build-out-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf work .redline "$OUT"
