# Checks that a finished OpenSSF Scorecard run reached scorecard.dev, and dispatches Scorecard once
# more when it did not. scorecard-action reports a failed publish as a warning on a green run, and
# the README badge then goes stale with nothing red to show for it. The rules are
# scripts/scorecard-publish/check.mjs, tested without the network by check.test.mjs.
#
# Pinned like the Redline workflows: a caller names one full commit sha of this repository's main,
#   uses: askalf/ci/actions/scorecard-publish-check@<sha>
# as the only step of a job that runs on workflow_run of its Scorecard workflow, and a change here
# reaches a repository only through a reviewed bump of that line. It cannot be a step of the
# Scorecard job: scorecard.dev accepts results only from a job whose steps it recognises.
#
# The step checks out nothing and runs on the Node the runner ships. The job needs
# `actions: write`, for the one dispatch, and nothing else.
name: Scorecard publish check
description: Check that a Scorecard run's result reached scorecard.dev, and run Scorecard once more when it did not.

inputs:
  token:
    description: A token with actions write on the repository, for the dispatch.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "true: say what would be dispatched, dispatch nothing."
    required: false
    default: 'false'
  # The finished Scorecard run, from the workflow_run event. A caller passes none of these: each
  # defaults to the event's own field. A workflow_run event that arrives with no run id fails the
  # step, so a runner that did not fill these in is a red run, not a check that never checks.
  run-id:
    description: The Scorecard run's id.
    required: false
    default: ${{ github.event.workflow_run.id }}
  run-event:
    description: The event that started the Scorecard run (schedule, push, workflow_dispatch).
    required: false
    default: ${{ github.event.workflow_run.event }}
  run-conclusion:
    description: How the Scorecard run ended.
    required: false
    default: ${{ github.event.workflow_run.conclusion }}
  run-branch:
    description: The branch the Scorecard run was on.
    required: false
    default: ${{ github.event.workflow_run.head_branch }}
  run-started-at:
    description: When the Scorecard run started.
    required: false
    default: ${{ github.event.workflow_run.run_started_at }}
  run-path:
    description: The Scorecard workflow's file, as the run names it.
    required: false
    default: ${{ github.event.workflow_run.path }}
  default-branch:
    description: The repository's default branch.
    required: false
    default: ${{ github.event.repository.default_branch }}
  private:
    description: Whether the repository is private.
    required: false
    default: ${{ github.event.repository.private }}

runs:
  using: node24
  main: main.mjs
