# Says whether a push to the default branch carries a tree that this workflow already tested green
# on the pull request that merged it, so the job can skip its build and test steps instead of
# running them a second time on the same files. The rules are scripts/tree-tested/check.mjs (its
# header says each one), tested without the network by check.test.mjs.
#
# Pinned like the other actions here: a caller names one full commit sha of this repository's main,
#   - id: tree
#     uses: askalf/ci/actions/tree-tested@<sha>
#     with:
#       same-on-pull-request: true
# as an early step of a job, and puts `if: steps.tree.outputs.tested != 'true'` on the steps that
# install, build and test. same-on-pull-request is the caller's word that the job runs the same steps,
# commands and inputs on a push as on a pull request (nothing that runs only on push, no matrix a
# push widens, one checkout of the event's own commit); without it the answer is always false. A
# job that also checks out another repository at a commit its tree names (a pinned sha in a file)
# lists that repository in pinned-checkouts. On anything but a push to the default branch it answers
# false without a request. Every read that fails, and every rule that does not hold, answers false
# too: the job then runs in full, as it did before. The step never fails the job.
#
# It checks out nothing and runs on the Node the runner ships. The job's token needs actions: read,
# contents: read and pull-requests: read, which a workflow's default token has unless its
# permissions block leaves one out.
name: Tree tested
description: Say whether this push's tree already passed this workflow on the pull request that merged it.

inputs:
  token:
    description: A token that reads the repository's commits, pull requests and Actions runs.
    required: false
    default: ${{ github.token }}
  same-on-pull-request:
    description: >-
      true: the caller declares that this job runs the same steps, commands and inputs on a push as
      on a pull request. Anything else, and the answer is false.
    required: false
    default: 'false'
  pinned-checkouts:
    description: >-
      Other repositories this job checks out, owner/name, separated by spaces, commas or new lines.
      Each is the caller's word that its checkout is at a full commit sha the tree itself names (read
      from a file of the checkout, so the same tree checks out the same commit), into a directory of
      its own. The log must show each checkout at a full sha, in a path under the workspace. A
      checkout of a repository not named here is not taken. Empty, the default: the job may check
      out only its own repository.
    required: false
    default: ''
  default-branch:
    description: The repository's default branch. A caller passes none.
    required: false
    default: ${{ github.event.repository.default_branch }}

outputs:
  tested:
    description: "true when this tree already passed this workflow, with every job and step, and this job ran there on exactly this tree; else false."
  run:
    description: The run that tested it, when tested is true.

runs:
  using: node24
  main: main.mjs
