# Posts the fleet review-lane commit statuses, fleet/verify and fleet/review, on a pull request's
# head. The rules and the mechanics are scripts/fleet-status/fleet-status.mjs, tested without GitHub.
#
# Pinned like the Redline workflows: a caller names one full commit sha of this repository's main,
#   uses: askalf/ci/actions/fleet-status@<sha>
# and a change here reaches a repository only through a reviewed bump of that line.
#
# The script runs from this action's own files at that commit and reads and writes through the
# REST API only. It runs as a JavaScript action (main.mjs) on the Node the runner ships, not as a
# composite with a setup-node step: a status job takes a few seconds of API reads, and setup-node
# and its download were about a third of it. The step checks out nothing, so a fork PR's events may
# run it with a write token: no PR code is ever on the runner. The caller's job if: decides which
# events run it (fleet-status.yml in each repository; the fleet-status-check action holds it to
# that shape).
#
# The job needs `statuses: write` and `contents`, `pull-requests`, `issues` and `checks` read.
name: Fleet status
description: Post the fleet/verify and fleet/review statuses on a pull request's head, or on every open same-repo pull request.

inputs:
  token:
    description: A token with statuses write and contents, pull-requests, issues and checks read on the repository.
    required: false
    default: ${{ github.token }}
  pr:
    description: The pull request number. Empty on a fork's workflow_run, where head-repo and head-branch find it.
    required: false
    default: ''
  head-repo:
    description: A workflow_run's head repository. When it is not this repository, the open PRs from it and head-branch get the statuses.
    required: false
    default: ''
  head-branch:
    description: A workflow_run's head branch, with head-repo.
    required: false
    default: ''
  all-open:
    description: "true: every open same-repo pull request, every page (the backfill)."
    required: false
    default: 'false'
  dry-run:
    description: "true: print the statuses, post nothing."
    required: false
    default: 'false'
  target-url:
    description: Where each status links. Empty links the run.
    required: false
    default: ''

runs:
  using: node24
  main: main.mjs
